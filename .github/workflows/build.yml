name: Build THE WALL
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: THE-WALL-Windows-x64
          path: build/Release/TheWall.exe
          if-no-files-found: error
          retention-days: 14
